{t:"눈 감고 첫 소절부터 감정 올인",s:{이소라:2,김윤아:3,씨야:2}},
{t:"안무까지 완벽하게 준비된 풀패키지",s:{보아:3,티아라:2}},

let step="intro",qi=0,answers=[],ranked=[],selected=null;
const app=document.getElementById("app");

function calcScores(){
  const sc={};R.forEach(r=>sc[r.key]=0);
  answers.forEach((oi,qIdx)=>{const opt=QS[qIdx]?.o[oi];if(opt?.s)Object.entries(opt.s).forEach(([k,v])=>{if(sc[k]!==undefined)sc[k]+=v})});
  const sorted=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const t3=sorted.slice(0,3).reduce((a,[,s])=>a+s,0)||1;
  return sorted.map(([key,score],i)=>({...R.find(r=>r.key===key),score,pct:i<3?Math.round((score/t3)*100):0}));
}

function captureCard(){
  const r=ranked[0],sub=ranked.slice(1,3);
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d"),c1=r.color[0];
  const bg=x.createLinearGradient(0,0,W*.3,H);bg.addColorStop(0,"#0C0C10");bg.addColorStop(.4,"#12101A");bg.addColorStop(1,"#0C0C10");
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  const gw=x.createRadialGradient(W/2,H*.25,0,W/2,H*.25,300);gw.addColorStop(0,c1+"28");gw.addColorStop(1,"transparent");
  x.fillStyle=gw;x.fillRect(0,0,W,H);
  x.textAlign="center";
  x.font="120px sans-serif";x.fillText(r.emoji,W/2,H*.20);
  x.font="500 28px sans-serif";x.fillStyle="#9896A8";x.fillText("당신의 내면의 디바는",W/2,H*.27);
  x.font="800 72px sans-serif";x.fillStyle=c1;x.shadowColor=c1+"50";x.shadowBlur=40;
  x.fillText(r.name,W/2,H*.34);x.shadowBlur=0;
  x.font="600 24px sans-serif";x.fillStyle="#9896A8";x.fillText(r.mbti+" · "+r.mbtikw,W/2,H*.38);
  x.font="600 28px sans-serif";x.fillStyle=c1+"CC";x.fillText(r.tag+"  ·  "+r.stat,W/2,H*.42);
  x.font="800 40px sans-serif";x.fillStyle=c1;x.fillText(r.pct+"%",W/2,H*.47);
  const lines=r.description.split("\n");const lineH=46;const pad=40;
  const dX=80,dW=W-160,dY=H*.50,dH=pad*2+lines.length*lineH;
  x.fillStyle=c1+"0A";x.beginPath();x.roundRect(dX,dY,dW,dH,20);x.fill();
  x.strokeStyle=c1+"12";x.lineWidth=1;x.beginPath();x.roundRect(dX,dY,dW,dH,20);x.stroke();
  x.font="400 32px sans-serif";x.fillStyle="#E0DFE8";
  let ly=dY+pad;for(const line of lines){x.fillText(line,W/2,ly);ly+=lineH}
  const sY=ly+50;
  x.font="500 22px sans-serif";x.fillStyle="#4A4A5A";x.fillText("당신 안의 숨은 서브 디바",W/2,sY);
  for(let i=0;i<sub.length;i++){const s=sub[i];x.font="400 28px sans-serif";x.fillStyle=s.color[0]+"BB";x.fillText(s.emoji+" "+s.name+" "+s.pct+"%",W/2,sY+40+(i*45))}
  x.font="400 22px sans-serif";x.fillStyle="#3A3A4A";x.fillText("🎤 나의 내면에 숨쉬는 디바는 누구? (이쪽편)",W/2,H*.95);
  const link=document.createElement("a");link.download="diva-"+r.key+".png";link.href=c.toDataURL("image/png");link.click();
}

function render(){
  if(step==="intro"){
    app.innerHTML=`<div class="fade-in" style="min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px;text-align:center">
      <img src="og-image.png" alt="당신의 보컬유형은?" style="width:100%;max-width:480px;border-radius:16px;margin-bottom:20px">
      <h1 style="font-size:22px;font-weight:800;margin:0 0 14px;line-height:1.5">나의 내면에 숨쉬는<br>디바는 누구? (이쪽편)</h1>
      <p style="color:#9896A8;font-size:13px;line-height:1.9;white-space:pre-line;margin:0 0 32px">(이쪽) 사람들이라면 누구나 내면에 디바가 있다!\n간단한 질문으로 알아보는, 본격! 디바 탐구 생활!\n이 안에 멋지고 놀라운 걸 심어뒀는데~🎵</p>
      <button onclick="startTest()" style="padding:16px 48px;border:none;border-radius:10px;font-size:16px;font-weight:700;color:#0F0F14;background:linear-gradient(135deg,#C8A82E,#E8D88C);box-shadow:0 4px 20px rgba(200,168,46,0.2)">테스트 시작하기 ✨</button>
      <p style="color:#4A4A5A;font-size:11px;margin-top:14px">총 14문항 · 약 4분 소요</p>\n      <img src="logo.png" alt="모임 로고" style="width:60px;opacity:0.4;margin-top:20px">
    </div>`;
  }
  else if(step==="play"){
    const q=QS[qi],pct=(qi/QS.length)*100;
    let opts="";q.o.forEach((o,i)=>{opts+=`<button onclick="pick(${i})" style="width:100%;padding:12px 14px;text-align:left;border:1.5px solid #2A2A3A;border-radius:10px;font-size:13.5px;line-height:1.45;background:#1A1A24;color:#F0EFF4;transition:all .2s">${o.t}</button>`});
    app.innerHTML=`<div class="fade-in" style="min-height:100dvh;padding:24px 16px"><div style="max-width:480px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:11px;color:#C8A82E;font-weight:700">Q${qi+1}</span><span style="font-size:11px;color:#4A4A5A">${qi+1} / ${QS.length}</span></div>
      <div style="height:3px;background:#2A2A3A;border-radius:2px;margin-bottom:16px;overflow:hidden"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#C8A82E,#E8D88C);border-radius:2px;transition:width .4s"></div></div>
      <div style="background:#1A1A24;border-radius:16px;padding:22px 18px;border:1px solid #2A2A3A">
        <p style="font-size:15.5px;font-weight:700;margin:0 0 18px;line-height:1.55">${q.q}</p>
        <div style="display:flex;flex-direction:column;gap:9px">${opts}</div>
      </div>
      <!-- 모임 홍보 -->
      <div style="margin-top:20px;background:#1A1A24;border-radius:16px;padding:20px;border:1px solid #2A2A3A;text-align:center">
        <p style="font-size:12px;color:#9896A8;margin:0 0 12px;font-weight:600">우리 모임이 궁금하다면?</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <a href="https://www.instagram.com/gain34793" target="_blank" rel="noopener" style="flex:1;max-width:160px;padding:12px;background:#2A2A3A;border-radius:10px;text-decoration:none;text-align:center">
            <span style="font-size:20px">📸</span>
            <p style="font-size:12px;color:#F0EFF4;margin:6px 0 0;font-weight:500">Instagram</p>
          </a>
          <a href="https://open.kakao.com/o/snR4t1df" target="_blank" rel="noopener" style="flex:1;max-width:160px;padding:12px;background:#2A2A3A;border-radius:10px;text-decoration:none;text-align:center">
            <span style="font-size:20px">💬</span>
            <p style="font-size:12px;color:#F0EFF4;margin:6px 0 0;font-weight:500">오픈카톡</p>
          </a>
        </div>
      </div>
      <!-- 모임 로고 -->
      <div style="margin-top:16px;text-align:center">
        <img src="logo.png" alt="모임 로고" style="width:80px;opacity:0.5">
      </div>
    </div></div>`;
  }
  else if(step==="reveal"){
    const msgs=["두근두근...","당신의 내면의 디바는...","바로...!"];
    let ct=3;
    function tick(){
      if(ct<=0){step="result";render();return}
      app.innerHTML=`<div style="min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
        <div style="font-size:80px;margin-bottom:20px;animation:pulse .7s ease-in-out">🔮</div>
        <p style="font-size:20px;font-weight:700;color:#C8A82E;margin:0">${msgs[3-ct]||""}</p>
        <p style="font-size:48px;font-weight:800;margin-top:12px">${ct}</p></div>`;
      ct--;setTimeout(tick,700);
    }
    tick();
  }
  else if(step==="result"&&ranked.length){
    const r=ranked[0],c1=r.color[0],sub=ranked.slice(1,3);
    let subHtml="";sub.forEach(s=>{subHtml+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#12121A;border-radius:10px"><span style="font-size:22px">${s.emoji}</span><div style="flex:1;text-align:left"><span style="font-size:13px;font-weight:600;color:${s.color[0]}">${s.name}</span><span style="font-size:11px;color:#4A4A5A;margin-left:6px">${s.tag}</span></div><span style="font-size:14px;font-weight:700;color:${s.color[0]}">${s.pct}%</span></div>`});
    app.innerHTML=`<div class="fade-in" style="min-height:100dvh;padding:24px 16px"><div style="max-width:440px;margin:0 auto">
      <div style="background:#1A1A24;border-radius:20px;padding:28px 20px;border:1px solid #2A2A3A;position:relative;overflow:hidden;text-align:center">
        <div style="position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,${c1}25,transparent 70%);pointer-events:none"></div>
        <div style="font-size:48px;margin-bottom:8px;position:relative">${r.emoji}</div>
        <p style="font-size:11px;color:#9896A8;letter-spacing:2px;font-weight:600;margin:0 0 4px">당신의 내면의 디바는</p>
        <h2 style="font-size:26px;font-weight:800;color:${c1};margin:0 0 6px;text-shadow:0 0 30px ${c1}40">${r.name}</h2>
        <div style="font-size:28px;font-weight:800;color:${c1};margin:0 0 6px">${r.pct}%</div>
        <p style="font-size:12px;color:#9896A8;margin:0 0 10px">${r.mbti} · ${r.mbtikw}</p>
        <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:600;color:${c1};background:${c1}18;padding:4px 14px;border-radius:20px">${r.tag}</span>
          <span style="font-size:11px;font-weight:600;color:#9896A8;background:#2A2A3A;padding:4px 14px;border-radius:20px">${r.stat}</span>
        </div>
        <div style="font-size:13.5px;line-height:1.8;text-align:center;padding:16px 18px;background:${c1}08;border-radius:12px;margin-bottom:16px;white-space:pre-line">${r.description}</div>
        <div style="margin-bottom:16px;text-align:center">
          <p style="font-size:11px;color:#4A4A5A;margin:0 0 10px;font-weight:600">🎵 이 유형의 추천곡</p>
          <a href="${r.song}" target="_blank" rel="noopener" style="text-decoration:none;display:block">
            <img src="https://img.youtube.com/vi/${r.songId}/mqdefault.jpg" alt="추천곡" style="width:100%;max-width:320px;border-radius:10px;margin:0 auto;display:block">
            <p style="font-size:13px;color:#E8D88C;margin:8px 0 0;font-weight:500">${r.songTitle}</p>
          </a>
        </div>
        ${sub.length?`<div style="border-top:1px solid #2A2A3A;padding-top:14px;margin-top:4px"><p style="font-size:11px;color:#4A4A5A;margin:0 0 10px;font-weight:600">당신 안의 숨은 서브 디바</p><div style="display:flex;flex-direction:column;gap:8px">${subHtml}</div></div>`:""}
        <p style="font-size:10px;color:#3A3A4A;margin:14px 0 0">🎤 나의 내면에 숨쉬는 디바는 누구? (이쪽편)</p>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button onclick="resetTest()" style="flex:1;padding:14px;border:none;border-radius:10px;font-size:14px;font-weight:600;color:#0F0F14;background:linear-gradient(135deg,#C8A82E,#E8D88C)">다시 해보기</button>
        <button onclick="captureCard()" style="flex:1;padding:14px;border:1px solid #2A2A3A;border-radius:10px;font-size:14px;font-weight:600;background:#1A1A24;color:#F0EFF4">📸 결과 저장</button>
      </div>
    </div></div>`;
  }
}

function startTest(){step="play";qi=0;answers=[];render()}
function pick(idx){
  if(selected!==null)return;selected=idx;
  const btns=app.querySelectorAll("button");
  if(btns[idx]){btns[idx].style.border="1.5px solid #C8A82E";btns[idx].style.background="rgba(200,168,46,0.1)";btns[idx].style.color="#E8D88C";btns[idx].style.fontWeight="600"}
  setTimeout(()=>{answers.push(idx);selected=null;if(qi+1<QS.length){qi++;render()}else{ranked=calcScores();step="reveal";render()}},350);
}
function resetTest(){step="intro";qi=0;answers=[];ranked=[];selected=null;render()}
render();
</script>
</body>
